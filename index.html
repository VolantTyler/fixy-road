<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Road Crew">
<meta name="theme-color" content="#79b95c">
<title>Road Crew</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: the road map fills the whole screen; controls float on it like
   road signs - a sign-yellow tool tray at the bottom, round buttons on top. */
:root {
  --sign: #ffc928;        /* warning-sign yellow */
  --cone: #ff7a1a;        /* safety orange */
  --ink: #1d1e22;         /* fresh asphalt */
  --paint: #fffdf5;       /* road-paint white */
  --go: #17a34a;          /* green light */
  --grass: #79b95c;
  --shade: rgba(20, 22, 26, .28);
  --f-display: "Fredoka", "Arial Rounded MT Bold", "Varela Round", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Fredoka", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--grass); color: var(--ink); font-family: var(--f-body); font-weight: 600;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; height: 100%; overflow: hidden; background: var(--grass); }
#cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid #2563eb; outline-offset: 2px; }

/* ---- in-game controls ---- */
#hud { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#topbar {
  position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: flex-start; gap: 8px;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#topbar > * { pointer-events: auto; }
.round {
  width: 54px; height: 54px; border-radius: 50%; background: var(--paint); border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--shade); display: flex; align-items: center; justify-content: center; flex: none;
}
.round:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shade); }
.round:disabled { opacity: .4; }
.round svg { width: 30px; height: 30px; }
.spacer { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 8px; align-items: center; pointer-events: none; }
.spacer > * { pointer-events: auto; }
#jobChip {
  display: flex; align-items: center; gap: 10px; background: var(--paint); border: 3px solid var(--ink); border-radius: 30px;
  padding: 6px 14px 6px 8px; box-shadow: 0 4px 0 var(--shade); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
}
#jobChip svg { width: 34px; height: 34px; flex: none; }
#jobTrack { width: 110px; height: 14px; border-radius: 8px; background: #d9d6c8; overflow: hidden; border: 2px solid var(--ink); }
#jobBar { height: 100%; width: 100%; background: var(--go); }
#jobBar.low { background: var(--cone); }
#btnGo {
  background: var(--go); color: var(--paint); font-family: var(--f-display); font-size: 28px; font-weight: 700; letter-spacing: .04em;
  border: 3px solid var(--ink); border-radius: 30px; padding: 6px 26px; box-shadow: 0 4px 0 var(--shade); min-width: 96px;
}
#btnGo:disabled { background: #a8a69a; }
#btnGo:not(:disabled) { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }

#toolbar {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 6px;
  overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
  padding-top: 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, rgba(29, 30, 34, .5), rgba(29, 30, 34, 0));
}
#toolbar::-webkit-scrollbar { display: none; }
.tool:first-child { margin-left: auto; } .tool:last-child { margin-right: auto; }
.tool {
  flex: none; width: 74px; height: 78px; border-radius: 16px; background: var(--paint); border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--shade); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  transition: transform .12s;
}
.tool span { font-size: 13px; font-weight: 700; line-height: 1; white-space: nowrap; }
.tool.on { background: var(--sign); transform: translateY(-8px); box-shadow: 0 10px 0 var(--shade); }

#toast {
  position: absolute; left: 50%; top: calc(78px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -12px);
  background: var(--sign); border: 4px solid var(--ink); border-radius: 14px; padding: 8px 22px; max-width: calc(100% - 32px);
  font-family: var(--f-display); font-size: 30px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none !important;
  text-align: center; box-shadow: 0 5px 0 var(--shade);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#hint {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none !important; text-align: center;
  font-family: var(--f-display); font-size: 34px; font-weight: 700; color: var(--paint); text-shadow: 0 3px 0 var(--ink), 0 0 12px rgba(0, 0, 0, .35);
}
#hint .trail { width: 240px; max-width: 70vw; height: 14px; margin: 14px auto 0; border-radius: 8px; background: repeating-linear-gradient(90deg, var(--ink) 0 26px, transparent 26px 40px); opacity: .55; }
#hint .finger { width: 54px; height: 54px; margin: -26px auto 0; border-radius: 50%; background: rgba(255, 253, 245, .92); border: 4px solid var(--ink); animation: swipe 2.2s ease-in-out infinite; }
@keyframes swipe { 0% { transform: translateX(-110px) scale(1.15); opacity: 0; } 15% { transform: translateX(-110px) scale(1); opacity: 1; } 80% { transform: translateX(110px) scale(1); opacity: 1; } 100% { transform: translateX(110px) scale(1.15); opacity: 0; } }

/* ---- panels ---- */
.sheet {
  background: var(--paint); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--shade);
}
#gearPanel {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(74px + env(safe-area-inset-top, 0px));
  width: 300px; max-width: calc(100% - 32px); max-height: calc(100% - 190px); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px;
}
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > b { flex: 1 1 100%; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; opacity: .65; }
.opt, .pill {
  flex: 1 1 0; min-width: 0; border: 3px solid var(--ink); border-radius: 14px; padding: 10px 6px; font-size: 18px; font-weight: 700; background: #e9e6d8; text-align: center;
}
.opt.on { background: var(--sign); }
.opt:not(.on) { text-decoration: line-through; opacity: .7; }
.pill.armed { background: var(--cone); color: var(--paint); }
#carsVal { flex: 1 1 0; text-align: center; font-size: 20px; }
.note { font-size: 14px; font-weight: 500; line-height: 1.35; margin: 0; opacity: .8; }

.screen {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#home { background: rgba(29, 30, 34, .28); }
#homeCard { width: 520px; max-width: 100%; padding: 0 0 22px; text-align: center; overflow: hidden; margin: auto; }
.stripes { height: 22px; background: repeating-linear-gradient(-45deg, var(--ink) 0 18px, var(--sign) 18px 36px); }
h1 {
  font-family: var(--f-display); font-weight: 700; font-size: clamp(44px, 12vw, 76px); line-height: .95; margin: 18px 12px 4px; letter-spacing: .01em; text-wrap: balance;
}
h1 em { font-style: normal; color: var(--cone); }
.tag { margin: 0 0 16px; font-size: 18px; font-weight: 500; opacity: .75; }
.bigRow { display: flex; gap: 14px; justify-content: center; padding: 0 20px; flex-wrap: wrap; }
.big {
  flex: 1 1 180px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 4px solid var(--ink); border-radius: 20px;
  padding: 14px 12px; font-family: var(--f-display); font-size: 34px; font-weight: 700; box-shadow: 0 6px 0 var(--shade);
}
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shade); }
#btnBuild { background: var(--sign); }
#btnJobs { background: var(--paint); }
.lvRow { display: flex; gap: 10px; justify-content: center; padding: 18px 20px 0; }
.lvl {
  flex: 1 1 0; min-width: 0; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 4px 10px; background: #e9e6d8; font-size: 19px; font-weight: 700;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.lvl .cones { display: flex; height: 30px; align-items: flex-end; }
.lvl .cones svg { width: 24px; height: 24px; margin: 0 -3px; }
.lvl.on { background: var(--go); color: var(--paint); box-shadow: 0 4px 0 var(--shade); transform: translateY(-3px); }

#jobsScreen { background: rgba(29, 30, 34, .5); }
#jobsCard { width: 640px; max-width: 100%; padding: 16px; margin: auto; }
#jobsHead { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
#jobsHead h2 { font-family: var(--f-display); font-size: 36px; margin: 0; flex: 1; }
#jobGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.jobCard {
  position: relative; border: 3px solid var(--ink); border-radius: 18px; background: #f2efe2; padding: 14px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 4px 0 var(--shade); font-size: 22px;
}
.jobCard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shade); }
.jobNum { position: absolute; left: 8px; top: 6px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--paint); font-size: 18px; line-height: 30px; }
.jobStars { display: flex; gap: 2px; height: 22px; }
.jobStars i { opacity: .22; filter: grayscale(1); }
.jobStars i.on { opacity: 1; filter: none; }

#result { background: rgba(29, 30, 34, .4); z-index: 5; }
#resCard { padding: 22px 26px; text-align: center; width: 420px; max-width: 100%; margin: auto; }
#resTitle { font-family: var(--f-display); font-size: 46px; margin: 4px 0 14px; }
#resStars { display: flex; justify-content: center; gap: 6px; }
.st { opacity: .2; filter: grayscale(1); }
.st.on { opacity: 1; filter: none; animation: pop .5s both; }
.st.on:nth-child(2) { animation-delay: .15s; } .st.on:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25); } to { transform: scale(1); } }
.resRow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.resRow .big { font-size: 26px; flex: 1 1 120px; padding: 10px; }
#resNext { background: var(--go); color: var(--paint); }
#resAgain { background: var(--sign); }

@media (max-width: 520px) {
  #topbar { flex-wrap: wrap; justify-content: space-between; row-gap: 8px; }
  .spacer { order: 9; flex: 1 1 100%; }
  #toast { top: calc(124px + env(safe-area-inset-top, 0px)); font-size: 24px; }
  #gearPanel { top: calc(66px + env(safe-area-inset-top, 0px)); }
  .round { width: 46px; height: 46px; } .round svg { width: 25px; height: 25px; }
  .tool { width: 64px; height: 70px; } .tool svg { width: 36px; height: 36px; } .tool span { font-size: 12px; }
  #jobTrack { width: 60px; } #jobChip { font-size: 20px; padding-right: 10px; }
  .big { font-size: 28px; }
}
@media (max-height: 460px) {
  h1 { font-size: 44px; margin-top: 10px; } .tag { display: none; } .big { padding: 8px 12px; font-size: 26px; } .lvRow { padding-top: 10px; }
  .tool { height: 66px; width: 66px; } .tool svg { width: 34px; height: 34px; }
}
@media (prefers-reduced-motion: reduce) {
  #hint .finger, #btnGo:not(:disabled), .st.on { animation: none; }
  .tool, #toast { transition: none; }
}
</style>
<div id="app">
  <canvas id="cv" aria-label="Road map. Drag to draw roads."></canvas>

  <div id="hud" hidden>
    <div id="topbar">
      <button class="round" id="btnHome" aria-label="Home"><svg viewBox="0 0 48 48"><path d="M6 24L24 7l18 17" fill="none" stroke="#1d1e22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 23v18h9V30h6v11h9V23" fill="#1d1e22"/></svg></button>
      <div class="spacer">
        <div id="jobChip" hidden>
          <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="16" width="40" height="18" rx="7" fill="#e5484d"/><rect x="13" y="19" width="20" height="12" rx="4" fill="#22303d"/></svg>
          <span id="jobCount">0 / 5</span>
          <div id="jobTrack"><div id="jobBar"></div></div>
        </div>
        <button id="btnGo" hidden>GO</button>
      </div>
      <button class="round" id="btnUndo" aria-label="Undo" disabled><svg viewBox="0 0 48 48"><path d="M18 10L6 21l12 11v-7h10a8 8 0 0 1 0 16H16" fill="none" stroke="#1d1e22" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="round" id="btnZoomOut" aria-label="Zoom out"><svg viewBox="0 0 48 48"><path d="M9 24h30" stroke="#1d1e22" stroke-width="6" stroke-linecap="round"/></svg></button>
      <button class="round" id="btnZoomIn" aria-label="Zoom in"><svg viewBox="0 0 48 48"><path d="M24 9v30M9 24h30" stroke="#1d1e22" stroke-width="6" stroke-linecap="round"/></svg></button>
      <button class="round" id="btnGear" aria-label="Settings"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="7" fill="none" stroke="#1d1e22" stroke-width="5"/><path d="M24 4v8M24 36v8M4 24h8M36 24h8M10 10l6 6M32 32l6 6M38 10l-6 6M16 32l-6 6" stroke="#1d1e22" stroke-width="5" stroke-linecap="round"/></svg></button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="hint" hidden>Draw a road<div class="trail"></div><div class="finger"></div></div>
    <div id="gearPanel" class="sheet" hidden>
      <div class="row"><b>Sound</b>
        <button class="opt on" id="optSound" aria-pressed="true">Sounds</button>
        <button class="opt on" id="optVoice" aria-pressed="true">Voice</button>
      </div>
      <div class="row"><b>Cars</b>
        <button class="pill" id="carsLess" aria-label="Fewer cars">&minus;</button><span id="carsVal">Some</span><button class="pill" id="carsMore" aria-label="More cars">+</button>
      </div>
      <div class="row"><b>New map (tap twice)</b>
        <button class="pill" id="mapGrass">Grass</button>
        <button class="pill" id="mapRiver">River</button>
        <button class="pill" id="mapTown">Town</button>
      </div>
      <p class="note">One finger draws. Two fingers move the map; pinch to zoom. The map saves itself on this device.</p>
      <button class="pill" id="gearClose">Done</button>
    </div>
    <div id="toolbar" role="toolbar" aria-label="Tools"></div>
  </div>

  <div id="home" class="screen">
    <div id="homeCard" class="sheet">
      <div class="stripes"></div>
      <h1>ROAD <em>CREW</em></h1>
      <p class="tag">Build roads. Set cones. Fix potholes.</p>
      <div class="bigRow">
        <button class="big" id="btnBuild"><svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><path d="M24 5l11 31H13z" fill="#ff7a1a"/><path d="M19.4 18h9.2l2.2 6.2H17.2zM16 28.5h16l1.6 4.5H14.4z" fill="#fff"/><rect x="7" y="36" width="34" height="7" rx="2" fill="#c2410c"/></svg>Build</button>
        <button class="big" id="btnJobs"><svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><path d="M24 4l6 13 14 2-10 10 2 14-12-7-12 7 2-14L4 19l14-2z" fill="#facc15" stroke="#a16207" stroke-width="2" stroke-linejoin="round"/></svg>Jobs</button>
      </div>
      <div class="lvRow" role="group" aria-label="Level">
        <button class="lvl" data-lv="0"><span class="cones"><svg viewBox="0 0 48 48"><path d="M24 5l11 31H13z" fill="#ff7a1a"/><rect x="7" y="36" width="34" height="7" rx="2" fill="#c2410c"/></svg></span>Easy</button>
        <button class="lvl" data-lv="1"><span class="cones"><svg viewBox="0 0 48 48"><path d="M24 5l11 31H13z" fill="#ff7a1a"/><rect x="7" y="36" width="34" height="7" rx="2" fill="#c2410c"/></svg><svg viewBox="0 0 48 48"><path d="M24 5l11 31H13z" fill="#ff7a1a"/><rect x="7" y="36" width="34" height="7" rx="2" fill="#c2410c"/></svg></span>Medium</button>
        <button class="lvl" data-lv="2"><span class="cones"><svg viewBox="0 0 48 48"><path d="M24 5l11 31H13z" fill="#ff7a1a"/><rect x="7" y="36" width="34" height="7" rx="2" fill="#c2410c"/></svg><svg viewBox="0 0 48 48"><path d="M24 5l11 31H13z" fill="#ff7a1a"/><rect x="7" y="36" width="34" height="7" rx="2" fill="#c2410c"/></svg><svg viewBox="0 0 48 48"><path d="M24 5l11 31H13z" fill="#ff7a1a"/><rect x="7" y="36" width="34" height="7" rx="2" fill="#c2410c"/></svg></span>Hard</button>
      </div>
    </div>
  </div>

  <div id="jobsScreen" class="screen" hidden>
    <div id="jobsCard" class="sheet">
      <div id="jobsHead">
        <button class="round" id="jobsBack" aria-label="Back"><svg viewBox="0 0 48 48"><path d="M28 8L12 24l16 16" fill="none" stroke="#1d1e22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <h2>Jobs</h2>
      </div>
      <div id="jobGrid"></div>
    </div>
  </div>

  <div id="result" class="screen" hidden>
    <div id="resCard" class="sheet">
      <div id="resStars"></div>
      <div id="resTitle">Great job!</div>
      <div class="resRow">
        <button class="big" id="resNext">Next</button>
        <button class="big" id="resAgain">Again</button>
        <button class="big" id="resHome">Jobs</button>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
'use strict';
/* =========================================================================
   ROAD CREW  -  world model
   The world is a grid of cells. Each cell can hold a ground road (z=0)
   and/or a bridge deck (z=1). A road piece is a "node"; nodes link to the
   four neighbours. Every node is split into "arms" (centre -> edge) and
   every arm into lane "slots". Cones, wear and repairs all live on slots.
   ========================================================================= */
var S = 64, HALF = 32, GW = 42, GH = 30;
var WORLD_W = GW * S, WORLD_H = GH * S;
var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];          // N, E, S, W

function opp(d) { return (d + 2) & 3; }
function rgt(d) { return (d + 1) & 3; }
function lft(d) { return (d + 3) & 3; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { return t * t * (3 - 2 * t); }
function hash(a, b, c) {
  var h = ((a * 73856093) ^ (b * 19349663) ^ ((c || 0) * 83492791)) | 0;
  h = (h ^ (h >>> 13)) | 0; h = (h * 1274126177) | 0; h = h ^ (h >>> 16);
  return ((h >>> 0) % 100003) / 100003;
}
function LWof(n) { return n === 1 ? 17 : 14; }          // lane width
function HWof(n) { return n * LWof(n) + 3; }            // half road width
function arrRemove(a, x) { var i = a.indexOf(x); if (i >= 0) a.splice(i, 1); }

/* ---- global game state ------------------------------------------------- */
var G = {
  screen: 'home', level: 0, tool: 'road', time: 0,
  sound: true, voice: true, carsScale: 1,
  job: null, lastRoadLanes: 1, paused: false
};

var grid = [[], []];
var terrain = [], deco = [];
var nodeList = [];
var nodeSeq = 1;
var topoDirty = true, topoVersion = 1;
var dirtyCells = {}, dirtyAll = true;
var zones = [], flaggers = [], arrowList = [];

function ci(cx, cy) { return cy * GW + cx; }
function inGrid(cx, cy) { return cx >= 0 && cy >= 0 && cx < GW && cy < GH; }
function nodeAt(cx, cy, z) { return inGrid(cx, cy) ? grid[z][ci(cx, cy)] : null; }
function markDirty(cx, cy) { if (inGrid(cx, cy)) dirtyCells[ci(cx, cy)] = 1; }
function touchCell(cx, cy) {
  for (var dy = -1; dy <= 1; dy++) for (var dx = -1; dx <= 1; dx++) markDirty(cx + dx, cy + dy);
}

function resetWorld() {
  var i, n = GW * GH;
  for (i = 0; i < n; i++) { grid[0][i] = null; grid[1][i] = null; terrain[i] = 0; deco[i] = 0; }
  nodeList = []; zones = []; flaggers = []; arrowList = [];
  if (typeof clearSim === 'function') clearSim();
  dirtyAll = true; topoDirty = true;
}

function newNode(cx, cy, z, lanes) {
  var n = {

      J.s = nodeAt(JOX, JOY + 4, 0); J.f = nodeAt(JOX + 13, JOY + 4, 0); J.sd = 1;
      jLock(0, 4, 1, 4); jLock(12, 4, 13, 4);
      for (var i = 0; i < nodeList.length; i++) for (var k = 0; k < 16; k++) nodeList[i].wear[k] = 0.46 + hash(i, k, 5) * 0.16;
      // eastbound lanes: arm E outward idx 6 (inner) 7 (outer); arm W inward idx 13 (inner) 12 (outer)
      jHoles([[3, 4, 7], [3, 4, 12], [4, 4, 7], [4, 4, 12], [5, 4, 7], [7, 4, 6], [7, 4, 13], [8, 4, 6], [8, 4, 13], [9, 4, 7], [10, 4, 12], [10, 4, 7]]);
    } }
];
function startJob(idx) {
  var def = JOBS[idx], J, i, x, y;
  if (!G.job) { sandboxSave = serializeWorld(); }
  resetWorld(); undoStack = []; $('btnUndo').disabled = true;
  J = { def: def, idx: idx, s: null, f: null, sd: 1, count: 0, target: def.cars, T: def.time[G.level], time: def.time[G.level], running: false, done: false, spawnT: 0, amb: [], ready: false, chk: 0 };

    if (!terrain[i] && !grid[0][i]) { var r = hash(x, y, idx + 40); deco[i] = inside ? (r < 0.035 ? 4 : 0) : (r < 0.2 ? 1 + ((r * 100) | 0) % 3 : (r < 0.27 ? 4 : 0)); }
  }
  J.sc = [J.s.cx, J.s.cy]; J.fc = [J.f.cx, J.f.cy];
  for (i = 0; i < J.amb.length; i++) { J.amb[i].a = nodeAt(JOX + J.amb[i].from[0], JOY + J.amb[i].from[1], 0); J.amb[i].b = nodeAt(JOX + J.amb[i].to[0], JOY + J.amb[i].to[1], 0); }
  G.job = J;
  showScreen('play');
  fitCam(JOX, JOY, JOX + 13, JOY + 8);
  $('jobChip').hidden = false; $('btnGo').hidden = false; $('result').hidden = true;
  jobHud(); toast(def.say, true);
}
function jobRebind() {
  var J = G.job, i; if (!J) return;
  J.s = nodeAt(J.sc[0], J.sc[1], 0); J.f = nodeAt(J.fc[0], J.fc[1], 0);
  for (i = 0; i < J.amb.length; i++) { J.amb[i].a = nodeAt(JOX + J.amb[i].from[0], JOY + J.amb[i].from[1], 0); J.amb[i].b = nodeAt(JOX + J.amb[i].to[0], JOY + J.amb[i].to[1], 0); }
}
function leaveJob() {
  if (!G.job) return;
  G.job = null; $('jobChip').hidden = true; $('btnGo').hidden = true; $('result').hidden = true;
  undoStack = []; $('btnUndo').disabled = true;
  if (!sandboxSave || !loadWorld(sandboxSave)) buildStarterWorld();
  sandboxSave = null;
}
function spawnAt(node, dir, kind, dest) {
  var i, o, px = node.cx * S + HALF - DX[dir] * HALF, py = node.cy * S + HALF - DY[dir] * HALF;
  for (i = 0; i < node.cars.length; i++) { o = node.cars[i]; if ((o.x - px) * (o.x - px) + (o.y - py) * (o.y - py) < 44 * 44) return false; }

}
function jobSpawn(dt) {
  var J = G.job, i, a;
  for (i = 0; i < J.amb.length; i++) {
    a = J.amb[i]; a.t -= dt;
    if (a.t <= 0 && a.a && a.b && a.a.alive && a.b.alive) { a.t = a.every * (0.8 + Math.random() * 0.5); spawnAt(a.a, a.dir, 'amb', a.b); }
  }

}
function jobCarArrived(c) {
  var J = G.job; if (!J || c.kind !== 'job' || J.done) return;
  J.count++; sfx('arrive'); sparkle(c.x, c.y, 0); jobHud();
  if (J.count >= J.target) jobFinish(true);
}
function jobHud() {
  var J = G.job; if (!J) return;
  $('jobCount').textContent = J.count + ' / ' + J.target;
  var go = $('btnGo');
  go.hidden = J.running || J.done;
  go.disabled = !J.ready; go.textContent = J.ready ? 'GO' : '...';
  if (!J.running) { $('jobBar').style.width = '100%'; $('jobBar').className = ''; }
}
function jobGo() {
  var J = G.job; if (!J || !J.ready || J.running) return;
  J.running = true; J.time = J.T; J.count = 0; J.spawnT = 0; sfx('go'); say('Go!'); jobHud();

function jobFinish(win) {
  var J = G.job; J.done = true; J.running = false;
  var stars = 0, i, h = '';
  if (win) {
    var left = J.time / J.T; stars = left > 0.4 ? 3 : (left > 0.18 ? 2 : 1);
    if (J.def.fix && countHoles() > 0 && stars > 2) stars = 2;      // three stars need every hole fixed
    if (!(prefs.stars[J.def.id + G.level] >= stars)) { prefs.stars[J.def.id + G.level] = stars; savePrefs(); }
    sfx('win'); say('Great job!');
    for (i = 0; i < 14; i++) sparkle(cam.x + (Math.random() - 0.5) * vw / cam.zoom * 0.7, cam.y + (Math.random() - 0.5) * vh / cam.zoom * 0.5, 1);
  } else say('Try again.');
  for (i = 0; i < 3; i++) h += '<span class="' + (i < stars ? 'st on' : 'st') + '">' + svg('star', 54) + '</span>';
  $('resStars').innerHTML = h; $('resStars').hidden = !win;
  $('resTitle').textContent = win ? 'Great job!' : 'Try again?';
  $('resNext').hidden = !win || J.idx >= JOBS.length - 1;
  $('result').hidden = false; jobHud();
}
function jobRetry() {
  var J = G.job, i; if (!J) return;
  for (i = cars.length - 1; i >= 0; i--) if (cars[i].kind === 'job') killCar(cars[i]);
  J.done = false; J.running = false; J.count = 0; J.time = J.T; $('result').hidden = true; jobHud();
}
function drawJobMarkers(c) {
  var J = G.job; if (!J || !J.s || !J.f) return;
  var x, y, k, q;
  x = J.s.cx * S + HALF - DX[J.sd] * 6; y = J.s.cy * S + HALF - 40;
  c.fillStyle = 'rgba(0,0,0,.2)'; rrect(c, x - 15, y - 13, 32, 30, 7); c.fill();
  c.fillStyle = '#16a34a'; rrect(c, x - 16, y - 16, 32, 30, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(x - 6, y - 9); c.lineTo(x + 8, y - 1); c.lineTo(x - 6, y + 7); c.closePath(); c.fill();
  x = J.f.cx * S + HALF; y = J.f.cy * S + HALF - 40;
  c.fillStyle = 'rgba(0,0,0,.2)'; rrect(c, x - 15, y - 13, 32, 30, 7); c.fill();
  c.fillStyle = '#fff'; rrect(c, x - 16, y - 16, 32, 30, 7); c.fill();
  c.save(); rrect(c, x - 13, y - 13, 26, 24, 4); c.clip(); c.fillStyle = '#18181b';
  for (k = 0; k < 4; k++) for (q = 0; q < 4; q++) if ((k + q) % 2 === 0) c.fillRect(x - 13 + k * 6.5, y - 13 + q * 6, 6.5, 6);
  c.restore();
}

/* ---- screens and menus ----------------------------------------------------- */
function showScreen(name) {
  G.screen = name;
  $('home').hidden = name !== 'home'; $('jobsScreen').hidden = name !== 'jobs';
  $('hud').hidden = name !== 'play'; $('gearPanel').hidden = true;
  if (name === 'play') { buildToolbar(); $('hint').hidden = prefs.hinted || !!G.job; onResize(); }
  if (name === 'home') markLevel();
}
function markLevel() {
  var bs = document.querySelectorAll('.lvl'), i;
  for (i = 0; i < bs.length; i++) bs[i].className = 'lvl' + ((+bs[i].getAttribute('data-lv')) === G.level ? ' on' : '');
  $('optSound').className = 'opt' + (G.sound ? ' on' : ''); $('optVoice').className = 'opt' + (G.voice ? ' on' : '');
  $('optSound').setAttribute('aria-pressed', G.sound ? 'true' : 'false'); $('optVoice').setAttribute('aria-pressed', G.voice ? 'true' : 'false');
  $('carsVal').textContent = G.carsScale <= 0.5 ? 'Few' : (G.carsScale >= 1.4 ? 'Lots' : 'Some');
}
function buildJobsScreen() {
  var h = '', i, k, st;
  for (i = 0; i < JOBS.length; i++) {
    st = prefs.stars[JOBS[i].id + G.level] || 0;
    h += '<button class="jobCard" data-job="' + i + '"><span class="jobNum">' + (i + 1) + '</span>' + svg(JOBS[i].icon, 60) + '<b>' + JOBS[i].name + '</b><span class="jobStars">';
    for (k = 0; k < 3; k++) h += '<i class="' + (k < st ? 'on' : '') + '">' + svg('star', 20) + '</i>';
    h += '</span></button>';

}
function goHome() { endStroke(false); saveWorldNow(); if (G.job) leaveJob(); showScreen('home'); homeCam(); }
function homeCam() { fitCam(9, 9, 35, 22); cam.zoom = Math.max(cam.zoom, Math.min(vw, vh) / 900); clampCam(); }
function startBuild() {
  if (G.job) leaveJob();
  showScreen('play'); fitCam(9, 10, 28, 20); cam.zoom = clamp(cam.zoom, 0.55, 1.2); clampCam();
  say(nodeList.length ? 'Build!' : 'Draw a road!');

function newMap(kind) {

  if (kind === 'starter') buildStarterWorld(); else genTerrain(kind, 1 + ((Math.random() * 50) | 0));
  saveWorldNow(); $('gearPanel').hidden = true; sfx('chime');

}
var armedBtn = null, armedT = 0;

  if (armedBtn === btn) { armedBtn = null; btn.className = btn.className.replace(' armed', ''); fn(); return; }
  if (armedBtn) armedBtn.className = armedBtn.className.replace(' armed', '');
  armedBtn = btn; armedT = 3; btn.className += ' armed'; sfx('click'); say('Tap again.');

    if (t && t !== this) { audioInit(); selectTool(t.getAttribute('data-tool')); }

/* ---- main loop -------------------------------------------------------------- */
var lastTs = 0, slowFrames = 0;
function frame(ts) {
  var raw = (ts - lastTs) / 1000; lastTs = ts;
  var dt = clamp(raw, 0.001, 0.05);
  if (!document.hidden) {
    simStep(dt);
    drawFrame();
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').className = ''; }
    if (armedT > 0) { armedT -= dt; if (armedT <= 0 && armedBtn) { armedBtn.className = armedBtn.className.replace(' armed', ''); armedBtn = null; } }
    if (saveTimer > 0) { saveTimer -= dt; if (saveTimer <= 0) saveWorldNow(); }
    // old tablets: if frames are slow, drop the drawing resolution a step
    if (raw > 0.034 && raw < 0.3) slowFrames++; else if (slowFrames > 0) slowFrames--;
    if (slowFrames > 80 && dpr > 1) { dpr = Math.max(1, dpr - 0.5); slowFrames = 0; resizeCanvas(); }
  }
  window.requestAnimationFrame(frame);
}
function boot() {

  var saved = storeGet('roadcrew.world');
  if (!saved || !loadWorld(saved)) buildStarterWorld();
  bindInput(); bindUi();
  resizeCanvas();
  showScreen('home'); homeCam();
  if (window.speechSynthesis) { pickVoice(); try { window.speechSynthesis.onvoiceschanged = pickVoice; } catch (e) { } }
  lastTs = (window.performance && performance.now) ? performance.now() : 0;
  window.requestAnimationFrame(frame);
}

  cars: function () { return cars; }, nodes: function () { return nodeList; }, zones: function () { return zones; }, crews: function () { return crews; },
  startBuild: startBuild, startJob: startJob, jobGo: jobGo, newMap: newMap, layLine: layLine, laySeq: laySeq, nodeAt: nodeAt,
  placeObj: placeObj, hitRoad: hitRoad, requestFix: requestFix, selectTool: selectTool, serialize: serializeWorld, reset: resetWorld
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
